<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <style>
      /* Subsetted (glyphs "/" and "C" only, ~680 bytes) from the same
         JetBrains Mono Bold used for the nav mark and favicon, embedded
         directly since this SVG is loaded as an isolated mask resource
         that never inherits the page's own @font-face / loaded fonts. */
      @font-face {
        font-family: 'JBM-C';
        font-weight: 700;
        src: url(data:font/woff2;base64,) format('woff2');
      }
    </style>
  </defs>
  <g font-family="'JBM-C'" font-weight="700" font-size="26" letter-spacing="-1" fill="#ffffff">
    <text x="10" y="34">/C</text>
    <text x="90" y="34">/C</text>
    <text x="170" y="34">/C</text>
    <text x="50" y="94">/C</text>
    <text x="130" y="94">/C</text>
    <text x="210" y="94">/C</text>
    <text x="10" y="154">/C</text>
    <text x="90" y="154">/C</text>
    <text x="170" y="154">/C</text>
    <text x="50" y="214">/C</text>
    <text x="130" y="214">/C</text>
    <text x="210" y="214">/C</text>
  </g>
</svg>
