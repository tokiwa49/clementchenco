<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <style>
      /* Subsetted (glyphs "/" and "C" only, ~680 bytes) from the same
         JetBrains Mono Bold used for the nav mark and favicon, embedded
         directly since this SVG is loaded as an isolated mask resource
         that never inherits the page's own @font-face / loaded fonts.
         font-size/letter-spacing match menu.html's .navbar-brand-mark
         (and 404.html's mark) exactly, not an approximation. */
      @font-face {
        font-family: 'JBM-C';
        font-weight: 700;
        src: url(data:font/woff2;base64,) format('woff2');
      }
    </style>
  </defs>
  <g font-family="'JBM-C'" font-weight="700" font-size="20" letter-spacing="-1.5" fill="#ffffff">
    <text x="8" y="26">/C</text>
    <text x="72" y="26">/C</text>
    <text x="136" y="26">/C</text>
    <text x="200" y="26">/C</text>
    <text x="40" y="74">/C</text>
    <text x="104" y="74">/C</text>
    <text x="168" y="74">/C</text>
    <text x="232" y="74">/C</text>
    <text x="8" y="122">/C</text>
    <text x="72" y="122">/C</text>
    <text x="136" y="122">/C</text>
    <text x="200" y="122">/C</text>
    <text x="40" y="170">/C</text>
    <text x="104" y="170">/C</text>
    <text x="168" y="170">/C</text>
    <text x="232" y="170">/C</text>
    <text x="8" y="218">/C</text>
    <text x="72" y="218">/C</text>
    <text x="136" y="218">/C</text>
    <text x="200" y="218">/C</text>
  </g>
</svg>
