<!DOCTYPE html>
<html lang="{{ or site.Language.Locale site.Language.Lang }}" dir="{{ or site.Language.Direction `ltr` }}" class="no-js">
<head>
  <script>document.documentElement.classList.replace("no-js", "js");</script>
  {{ partial "head.html" . }}
</head>
{{ $theme := "dark" }}
{{- with .Site.Params.theme }}
  {{ $theme = . }}
{{- end }}
<body
  {{- if eq $theme "dark" }}
    class="dark"
  {{- end }}
>
  <!-- <header>
    {{ partial "header.html" . }}
  </header> -->
  <main>
    {{ block "main" . }}{{ end }}
  </main>

  {{ if .Param "math" }}
    {{ partial "math.html" . }}
  {{ end }}
  <script>
    (function () {
      var STORAGE_KEY = "theme-preference";

      function systemPrefersDark() {
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      }

      function apply(isDark) {
        document.body.classList.toggle("dark", isDark);
        document.querySelectorAll("[data-theme-choice]").forEach(function (btn) {
          var pressed = isDark ? btn.dataset.themeChoice === "dark" : btn.dataset.themeChoice === "light";
          btn.setAttribute("aria-pressed", String(pressed));
        });
      }

      var stored = null;
      try { stored = localStorage.getItem(STORAGE_KEY); } catch (e) {}

      var fallbackIsDark = {{ if eq $theme "auto" }}systemPrefersDark(){{ else if eq $theme "dark" }}true{{ else }}false{{ end }};
      apply(stored ? stored === "dark" : fallbackIsDark);

      document.querySelectorAll("[data-theme-choice]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var choice = btn.dataset.themeChoice;
          try { localStorage.setItem(STORAGE_KEY, choice); } catch (e) {}
          apply(choice === "dark");
        });
      });
    })();

    (function () {
      var items = document.querySelectorAll(".reveal");
      if (!items.length) return;
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion || !("IntersectionObserver" in window)) {
        items.forEach(function (el) { el.classList.add("is-visible"); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.2, rootMargin: "0px 0px -40px 0px" });
      items.forEach(function (el) { io.observe(el); });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  {{ if .Site.Params.showFooterEverywhere}}
    <footer>
      {{ partial "footer.html" . }}
    </footer>
  {{ end }}

</body>
</html>
