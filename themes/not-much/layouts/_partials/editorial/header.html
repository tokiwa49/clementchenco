<header class="masthead inset">
  <a class="signature" href="{{ "/" | relURL }}" aria-label="Clement Chen homepage"><img class="mark" src="{{ "images/editorial/quiet-c.svg" | relURL }}" width="41" height="41" alt="/C"><span>Clement Chen</span></a>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" hidden>Menu</button>
  <nav class="nav" id="site-navigation" aria-label="Main navigation">
    <a class="mobile-home" href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
    <a href="{{ "/blog/" | relURL }}"{{ if or (eq .Section "blog") (in (slice "term" "taxonomy") .Kind) }} aria-current="page"{{ end }}>Writing</a>
    <a href="{{ "/about/" | relURL }}"{{ if eq .Section "about" }} aria-current="page"{{ end }}>About</a>
  </nav>
</header>
